<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Naresho Solar Ranches</title>
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <div class="logo">
        <img src="/logo.png" alt="Naresho Solar Ranches" id="nav-logo" />
      </div>
      <nav>
        <ul class="nav-links" id="nav-links">
          <li class="nav-close-item"><button class="nav-close" id="navClose" aria-label="Close menu">&times;</button></li>
          <li><a href="/">Home</a></li>
          <li><a href="/#about">About</a></li>
          <li><a href="/#project">The Project</a></li>
          <li><a href="/#why">Why Invest</a></li>
          <li><a href="/#advisory">Advisory Team</a></li>
          <li><a href="/#team">Our Team</a></li>
          <li><a href="/blog">News</a></li>
          <li><a href="/gallery">Gallery</a></li>
          <li><a href="/#contact" class="nav-cta">Contact Us</a></li>
        </ul>
      </nav>
      <div class="nav-overlay" id="navOverlay"></div>
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>
  </header>

  <!-- ===== ARTICLE ===== -->
  <article class="article-page" id="article-page">
    <div class="container">
      <a href="/blog" class="back-link">← Back to News</a>
      <div id="article-content">
        <p style="text-align:center;color:#888;padding:40px 0;">Loading article...</p>
      </div>
    </div>
  </article>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-top">
        <div class="footer-brand">
          <img src="/logo.png" alt="Naresho Solar Ranches" class="footer-logo" id="footer-logo" />
          <p id="footer-desc"></p>
          <p class="footer-reg" id="footer-reg"></p>
        </div>
        <div class="footer-links">
          <h4>Navigation</h4>
          <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/#about">About</a></li>
            <li><a href="/#project">The Project</a></li>
            <li><a href="/#why">Why Invest</a></li>
            <li><a href="/#advisory">Advisory Team</a></li>
            <li><a href="/#team">Our Team</a></li>
            <li><a href="/blog">News</a></li>
            <li><a href="/gallery">Gallery</a></li>
            <li><a href="/#contact">Contact</a></li>
          </ul>
        </div>
        <div class="footer-contact">
          <h4>Contact</h4>
          <p id="footer-address"></p>
          <p id="footer-phone"></p>
          <p id="footer-email"></p>
          <p id="footer-postal"></p>
        </div>
      </div>
      <div class="footer-bottom">
        <p id="footer-copyright"></p>
      </div>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    document.getElementById('navbar').classList.add('scrolled');
    window.addEventListener('scroll', () => document.getElementById('navbar').classList.add('scrolled'));

    const hamburger = document.getElementById('hamburger');
    const navLinks = document.querySelector('.nav-links');
    const navOverlay = document.getElementById('navOverlay');
    const navClose = document.getElementById('navClose');
    function openMenu() { navLinks.classList.add('open'); navOverlay.classList.add('active'); hamburger.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeMenu() { navLinks.classList.remove('open'); navOverlay.classList.remove('active'); hamburger.classList.remove('active'); document.body.style.overflow = ''; }
    hamburger.addEventListener('click', openMenu);
    navClose.addEventListener('click', closeMenu);
    navOverlay.addEventListener('click', closeMenu);

    // ===== LOAD SITE DATA (logo, footer) =====
    async function loadSiteData() {
      try {
        const res = await fetch('/api/content');
        const c = await res.json();
        if (c.site && c.site.logo) {
          document.getElementById('nav-logo').src = '/' + c.site.logo;
          document.getElementById('footer-logo').src = '/' + c.site.logo;
        }
        const f = c.footer;
        if (f) {
          document.getElementById('footer-desc').textContent = f.desc || '';
          document.getElementById('footer-reg').textContent = f.reg || '';
          document.getElementById('footer-address').innerHTML = f.address || '';
          document.getElementById('footer-phone').innerHTML = f.phone ? `<a href="tel:${f.phone}">${f.phone}</a>` : '';
          document.getElementById('footer-email').innerHTML = f.email ? `<a href="mailto:${f.email}">${f.email}</a>` : '';
          document.getElementById('footer-postal').textContent = f.postal || '';
          document.getElementById('footer-copyright').textContent = f.copyright || '';
        }
      } catch (e) { console.warn('Could not load site data', e); }
    }

    // ===== LOAD ARTICLE =====
    const pathParts = window.location.pathname.split('/');
    const articleId = pathParts[pathParts.length - 1];

    async function loadArticle() {
      try {
        const res = await fetch(`/api/blog/${articleId}`);
        if (!res.ok) throw new Error('Not found');
        const post = await res.json();

        // Get site title for document title
        let siteTitle = 'Naresho Solar Ranches';
        try {
          const sc = await fetch('/api/content');
          const sd = await sc.json();
          if (sd.site && sd.site.title) siteTitle = sd.site.title;
        } catch {}

        document.title = post.title + ' — ' + siteTitle;

        function formatContent(text) {
          if (!text) return '';
          if (/<[a-z][\s\S]*>/i.test(text)) return text;
          return text.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br />')}</p>`).join('');
        }

        document.getElementById('article-content').innerHTML = `
          <div class="article-header">
            <span class="section-tag">${formatDate(post.date)}</span>
            <h1>${esc(post.title)}</h1>
            <div class="article-meta"><span>By ${esc(post.author)}</span></div>
          </div>
          ${post.image ? `<div class="article-image"><img src="${escAttr(post.image)}" alt="${escAttr(post.title)}" /></div>` : ''}
          <div class="article-body">${formatContent(post.content)}</div>
          <div style="margin-top:48px;text-align:center;">
            <a href="/blog" class="btn btn-primary">← Back to All News</a>
          </div>
        `;
      } catch {
        document.getElementById('article-content').innerHTML = `
          <div style="text-align:center;padding:60px 0;">
            <h2 style="font-family:'Montserrat',sans-serif;font-size:1.5rem;color:#0d1117;margin-bottom:12px;">Article Not Found</h2>
            <p style="color:#888;margin-bottom:24px;">This article may have been removed or is no longer available.</p>
            <a href="/blog" class="btn btn-primary">← Back to News</a>
          </div>
        `;
      }
    }

    function esc(str) { if (!str) return ''; return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escAttr(str) { if (!str) return ''; return str.replace(/"/g,'&quot;'); }
    function formatDate(d) { try { return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); } catch { return d; } }

    loadSiteData();
    loadArticle();
  </script>
</body>
</html>
